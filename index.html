<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Chosen Ones</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='50' font-size='84' text-anchor='middle' dominant-baseline='central'%3E%F0%9F%94%8D%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --ink:#1c1a24;
    --paper:#fbf7ee;
    --panel:#ffffff;
    --line:#e4ddc9;
    --claw:#c2543a;
    --claw-dark:#9c3f2a;
    --win:#2f7a52;
    --alert:#b8321f;
    --muted:#7a7568;
    --track:#efe8d6;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family: ui-sans-serif, "Segoe UI", system-ui, sans-serif;padding:32px 16px 64px;}
  .wrap{max-width:1100px;margin:0 auto;}
  header{margin-bottom:24px;}
  h1{font-size:2.2rem;font-weight:800;margin:0 0 4px;letter-spacing:-0.01em;}
  .sub{color:var(--muted);font-size:0.95rem;line-height:1.55;max-width:none;}
  .sub b{color:var(--ink);}

  .global-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px;font-size:0.8rem;color:var(--muted);flex-wrap:wrap;}
  .global-bar .status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:5px;position:relative;top:-1px;}
  .global-bar .status-dot.live{background:var(--win);}

  .loading{padding:40px 20px;text-align:center;color:var(--muted);font-size:0.9rem;}

  .machine{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 22px 18px;margin-bottom:22px;position:relative;}
  .machine.alerting{border-color:var(--alert);box-shadow:0 0 0 3px rgba(184,50,31,0.12);}
  .machine-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;}
  .machine-name{font-size:1.15rem;font-weight:600;background:transparent;border:none;border-bottom:1px dashed transparent;padding:2px 0;width:100%;color:var(--ink);font-family:inherit;}
  .machine-name:hover, .machine-name:focus{border-bottom:1px dashed var(--line);outline:none;}
  .machine-name-static{font-size:1.05rem;font-weight:600;color:var(--ink);padding:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;}
  .top-actions{display:flex;gap:4px;align-items:center;flex-shrink:0;}
  .icon-btn{background:none;border:none;color:var(--muted);font-size:0.8rem;cursor:pointer;padding:4px 6px;white-space:nowrap;}
  .card-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px;}
  .card-head-main{flex:1;min-width:0;}
  .card-head-main .machine-top{margin-bottom:10px;}
  .prize-thumb{width:76px;height:76px;object-fit:cover;border-radius:6px;flex-shrink:0;background:#eee;}
  .card-head-side{display:flex;flex-direction:column;gap:8px;flex-shrink:0;}
  .mini-links{display:flex;flex-direction:column;gap:6px;}
  .mini-links button{width:100%;background:white;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:0.8rem;color:var(--claw-dark);cursor:pointer;font-family:inherit;font-weight:600;white-space:nowrap;}
  .mini-links button:hover{border-color:var(--claw);background:#fdf6ec;}
  .machine-summary{display:flex;gap:18px;font-size:0.72rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted);}
  .machine-summary{flex-wrap:wrap;}
  .machine-summary .summary-tag{text-transform:none;letter-spacing:normal;font-size:0.85rem;color:var(--ink);}
  .machine-summary .summary-tag.stale{color:var(--alert);}
  .machine-summary b{color:var(--ink);font-size:0.85rem;text-transform:none;letter-spacing:normal;}
  .machine-summary.machine-cost{margin-top:8px;}
  .prize-others{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .prize-other{width:60px;height:60px;padding:0;border:1px solid var(--line);border-radius:8px;background:#eee;cursor:pointer;overflow:hidden;flex-shrink:0;}
  .prize-other img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;}
  .prize-other:hover{border-color:var(--ink);}
  .prize-other.stale{opacity:0.5;}
  .icon-btn:hover{color:var(--claw-dark);}

  .live-config{background:var(--track);border-radius:10px;padding:12px 14px;margin-bottom:14px;}
  .prize-info{background:#fdf6ec;border:1px solid #f0e6cc;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:0.85rem;color:var(--ink);}
  .prize-info .prize-title-en{font-weight:600;}
  .prize-info .prize-title-ja{color:var(--muted);}
  .prize-info .prize-meta{margin-top:4px;font-size:0.78rem;color:var(--muted);}
  .prize-info .prize-meta b{color:var(--ink);}
  .prize-info .prize-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;}
  .prize-info select{flex:1;min-width:0;max-width:100%;border:1px solid var(--line);background:white;border-radius:6px;padding:7px 8px;font-size:0.82rem;font-family:inherit;color:var(--ink);}
  .prize-info .prize-actions button.ghost{padding:6px 12px;font-size:0.82rem;}
  .prize-label{color:var(--claw-dark);}
  .prize-label.last-chance{color:var(--alert);}
  .quick-links{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .quick-links button{background:white;border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:0.8rem;color:var(--claw-dark);cursor:pointer;font-family:inherit;font-weight:600;}
  .quick-links button:hover{border-color:var(--claw);background:#fdf6ec;}
  .link-hint{font-size:0.76rem;margin-top:6px;color:var(--muted);}
  .link-hint.ok{color:var(--win);}
  .link-hint.err{color:var(--alert);}
  .live-config label{display:block;font-size:0.72rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted);margin-bottom:4px;margin-top:8px;}
  .live-config label:first-child{margin-top:0;}
  .live-config input{width:100%;border:1px solid var(--line);background:white;border-radius:6px;padding:7px 9px;font-size:0.85rem;font-family:inherit;}
  .live-config .row{display:flex;gap:10px;}
  .live-config .row > div{flex:1;}
  .live-status{font-size:0.78rem;margin-top:8px;color:var(--muted);}
  .live-status.err{color:var(--alert);}
  .live-status.ok{color:var(--win);}
  .live-fields{display:flex;gap:14px;font-size:0.78rem;color:var(--muted);margin-top:8px;flex-wrap:wrap;}
  .live-fields b{color:var(--ink);}

  .simple-readout{display:flex;gap:14px;margin-bottom:14px;}
  .simple-readout .box{flex:1;background:linear-gradient(135deg, #fbeee7, #fdf6ec);border:1px solid #f0d9c9;border-radius:10px;padding:16px;text-align:center;}
  .simple-readout .box .num{font-size:2.4rem;font-weight:700;color:var(--claw-dark);line-height:1;}
  .simple-readout .box .now-playing{font-size:1.05rem;font-weight:600;color:var(--ink);word-break:break-all;}
  .simple-readout .box .now-playing.none{color:var(--muted);font-weight:500;font-size:0.95rem;}
  .player-tag-friend{color:#2f5fa8;font-weight:700;}
  .player-tag-farmer{color:var(--alert);font-weight:700;}
  .simple-readout .box .cap{font-size:0.72rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted);margin-top:6px;}

  .actions{display:flex;gap:10px;margin-bottom:6px;flex-wrap:wrap;}
  button.primary{background:var(--claw);color:white;border:none;border-radius:8px;padding:9px 16px;font-size:0.9rem;font-weight:600;cursor:pointer;font-family:inherit;}
  button.primary:hover{background:var(--claw-dark);}
  button.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:9px 14px;font-size:0.9rem;cursor:pointer;color:var(--ink);font-family:inherit;}
  button.ghost:hover{border-color:var(--claw);}
  button.ghost.danger:hover{border-color:var(--alert);color:var(--alert);}

  details{margin-top:10px;}
  summary{cursor:pointer;font-size:0.82rem;color:var(--muted);user-select:none;}
  .history{margin-top:10px;border-top:1px solid var(--line);padding-top:10px;max-height:260px;overflow-y:auto;}
  .step-table{width:100%;border-collapse:collapse;font-size:0.85rem;}
  .step-table th{text-align:left;color:var(--ink);font-weight:600;font-size:0.8rem;padding:8px 10px;border-bottom:2px solid var(--line);}
  .step-table td{padding:8px 10px;color:var(--ink);}
  .step-table tbody tr:nth-child(odd){background:var(--track);}
  .step-table .step-num{width:52px;white-space:nowrap;}
  .step-table .lose-x{color:#8a8a8a;margin-right:2px;}
  .step-table .player-link{color:#2b6fb3;text-decoration:underline;}
  .step-table .time-link{color:#2b6fb3;text-decoration:underline;white-space:nowrap;}
  .step-table tr.win .player-link, .step-table tr.win .time-link{color:#0f6e56;font-weight:700;}
  .step-table .trophy{margin-right:3px;}
  .hist-empty{font-size:0.82rem;color:var(--muted);font-style:italic;}

  .add-machine{display:block;width:100%;padding:14px;border-radius:12px;border:1.5px dashed var(--line);background:none;color:var(--muted);font-size:0.95rem;cursor:pointer;font-family:inherit;margin-bottom:16px;}
  .add-machine:hover{border-color:var(--claw);color:var(--claw-dark);}
  .empty-state{text-align:center;padding:40px 20px;color:var(--muted);font-size:0.9rem;}

  .play-alert{background:#fff4ef;border:2px solid #f08b6e;border-radius:10px;padding:14px;margin:12px 0;}
  .play-alert-title{font-weight:800;color:#b33b20;margin-bottom:8px;}
  .play-alert-title-row{display:flex;justify-content:space-between;align-items:center;gap:12px;}
  .play-alert-title-row .play-alert-title{margin-bottom:0;}
  .play-alert-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .play-alert-row input[type="number"]{width:180px;border:1px solid var(--line);border-radius:6px;padding:9px;font:inherit;background:#fff;}
  .play-alert-toggle{display:flex;align-items:center;gap:7px;font-weight:700;}
  .play-alert-status{font-size:.82rem;margin-top:7px;color:var(--muted);}
  .play-alert-status.armed{color:#16834a;font-weight:700;}

  .player-list-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:12px 0;}
  .player-list-status{font-size:.82rem;color:var(--muted);}

  .category-header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:30px 0 12px;}
  .category-header:first-child{margin-top:6px;}
  .category-header h2{font-size:1.15rem;margin:0;letter-spacing:-0.005em;}
  .category-summary{display:flex;align-items:center;flex-wrap:wrap;gap:8px;}
  .cat-badge{font-style:normal;font-size:0.72rem;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;}
  .cat-badge.last-chance{background:#fbecc8;color:#8a5a00;}
  .cat-badge.irrelevant{background:rgba(184,50,31,0.1);color:var(--alert);}
  .category-summary{font-size:0.85rem;color:var(--muted);font-style:italic;margin:0 0 16px;}
  .category-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
  .category-row label{font-size:0.72rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted);white-space:nowrap;}
  .category-row input{flex:1;border:1px solid var(--line);background:white;border-radius:6px;padding:6px 9px;font-size:0.85rem;font-family:inherit;}

  /* ---- Layout: two-column card grid ---- */
  .card-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start;}
  .card-grid .machine{margin-bottom:0;padding:16px 16px 14px;}
  @media (max-width:760px){.card-grid{grid-template-columns:1fr;}}

  /* ---- Smaller titles, smaller thumbnails ---- */
  .machine-name-static{font-size:.85rem;font-weight:600;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3;}
  .machine-name{font-size:1rem;}
  .card-head{gap:12px;margin-bottom:8px;}
  .card-head-side{width:80px;}
  .prize-thumb{width:70px;height:70px;}
  .mini-links button{padding:4px 6px;font-size:.74rem;}
  .prize-other{width:46px;height:46px;}

  /* ---- Big PLAYS / TARGET numbers, coloured by how close to target ---- */
  .stat-row{display:flex;gap:22px;align-items:flex-end;margin:4px 0 8px;flex-wrap:wrap;}
  .stat-slash{color:var(--muted);font-weight:500;margin:0 3px;}
  .stat-num{font-size:2.8rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink);}
  .stat-cap{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:4px;}
  .stat.stat-small .stat-num{font-size:1.25rem;font-weight:700;color:var(--muted);}
  .stat.heat-1 .stat-num, .simple-readout .box .num.heat-1{color:#b7791f;}
  .stat.heat-2 .stat-num, .simple-readout .box .num.heat-2{color:#d9531e;}
  .stat.heat-3 .stat-num, .simple-readout .box .num.heat-3{color:#c0261b;}
  .stat.heat-3 .stat-cap{color:#c0261b;font-weight:700;}

  /* ---- Each category gets its own colour (hue set per section by script) ---- */
  .cat-section{--h:30;}
  .cat-section .machine{background:hsl(var(--h) 65% 96%);border-color:hsl(var(--h) 40% 80%);border-left:6px solid hsl(var(--h) 55% 50%);}
  .cat-section .machine.alerting{border-color:var(--alert);border-left-color:var(--alert);}
  .cat-section .category-header h2{display:flex;align-items:center;gap:8px;color:hsl(var(--h) 55% 28%);}
  .cat-section .category-header h2::before{content:"";width:14px;height:14px;border-radius:50%;background:hsl(var(--h) 55% 50%);}

  /* ---- Card / section buttons are visibly different ---- */
  .card-toggle{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;padding:0;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--muted);cursor:pointer;flex-shrink:0;}
  .card-toggle:hover{color:var(--claw-dark);border-color:var(--claw);}
  .card-toggle svg, .tool-btn svg{pointer-events:none;display:block;}
  .cat-toggle{border:none;border-radius:999px;padding:6px 14px;font-size:.78rem;font-weight:700;color:#fff;background:hsl(var(--h) 55% 45%);cursor:pointer;font-family:inherit;white-space:nowrap;}
  .cat-toggle:hover{background:hsl(var(--h) 55% 34%);}
  .toolbar{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin:0 0 4px;font-size:.78rem;color:var(--muted);}
  .tool-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:.78rem;color:var(--ink);cursor:pointer;font-family:inherit;}
  .tool-btn:hover{border-color:var(--claw);}

  /* ---- Drag and drop ---- */
  .drag-handle{cursor:grab;color:var(--muted);user-select:none;font-size:1rem;line-height:1;letter-spacing:-3px;padding:4px 6px 4px 0;flex-shrink:0;}
  .drag-handle:active{cursor:grabbing;}
  .machine.dragging{opacity:.4;}
  .cat-section .machine.drop-before{box-shadow:-6px 0 0 0 var(--claw) !important;}
  .cat-section .machine.drop-after{box-shadow:6px 0 0 0 var(--claw) !important;}
  .cat-section.drop-into{outline:2px dashed hsl(var(--h) 55% 50%);outline-offset:6px;border-radius:14px;}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:.85rem;display:flex;gap:14px;align-items:center;z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.25);}
  .toast button{background:none;border:none;color:#ffd9a0;font-weight:700;cursor:pointer;font-family:inherit;font-size:.85rem;}

  /* ---- Expanded card: compact body, settings tucked into sections ---- */
  .x-body{display:flex;flex-direction:column;gap:10px;}
  .x-titles{font-size:.76rem;color:var(--muted);line-height:1.4;margin-top:2px;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{font-size:.74rem;background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted);}
  .chip b{color:var(--ink);}
  .chip.last-chance{background:#fbecc8;border-color:#ecd18a;color:#8a5a00;}
  .chip.warn{background:#fdeceb;border-color:#e2a89a;color:#8a2c1c;}
  .warn-box{background:#fdeceb;border:1px solid #e2a89a;border-radius:10px;padding:8px 12px;font-size:.8rem;color:#8a2c1c;line-height:1.45;}
  .live-line{font-size:.85rem;display:flex;flex-direction:column;gap:3px;}
  .muted{color:var(--muted);}
  .x-body .prize-actions{display:flex;gap:8px;}
  .x-body .prize-actions select{flex:1;min-width:0;border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 8px;font-size:.82rem;font-family:inherit;color:var(--ink);}
  .sect{background:#fff;border:1px solid var(--line);border-radius:10px;margin:0;}
  .sect > summary{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:.85rem;font-weight:600;color:var(--ink);list-style:none;}
  .sect > summary::-webkit-details-marker{display:none;}
  .sect > summary::after{content:"▾";color:var(--muted);}
  .sect[open] > summary::after{content:"▴";}
  .sect-status{font-weight:500;color:var(--muted);font-size:.76rem;margin-left:auto;}
  .sect-body{padding:2px 12px 12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;}
  .sect-body .play-alert-row{width:100%;}
  .sect-body .play-alert-row input[type="number"]{width:120px;padding:6px 8px;}
  .sect-body button.ghost{padding:6px 12px;font-size:.82rem;}
  .sect-body .play-alert-status{margin-top:0;}
  .sect-body .category-row, .sect-body .live-config{width:100%;margin-bottom:0;}
  .sect-body .history{margin-top:0;border-top:none;padding-top:0;width:100%;}
  .mini-field{display:flex;flex-direction:column;gap:3px;font-size:.74rem;color:var(--muted);}
  .mini-field input{width:90px !important;}
  .payout-val{font-weight:800;font-size:1.1rem;padding:5px 0;color:var(--ink);}

  /* ---- Card header: prizes on the left, links + toggle on the right ---- */
  .card-head-side{width:100px;display:flex;flex-direction:column;gap:6px;flex-shrink:0;}
  .prize-thumb{width:100px;height:100px;}
  .prize-others{display:flex;gap:5px;flex-wrap:wrap;margin-top:0;}
  .prize-other{width:30px;height:30px;border-radius:6px;}
  .card-head-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px;flex-shrink:0;}
  .card-head-right .mini-links{width:80px;}

  /* ---- Armed alert: warm glow ---- */
  .cat-section .machine.armed{box-shadow:0 0 0 2px #e8a317, 0 0 16px 3px rgba(232,163,23,.5);}

  /* ---- Card header v3: prize row on top, links + toggle on its right ---- */
  .card-head{flex-direction:column;gap:10px;margin-bottom:8px;}
  .card-top{display:flex;align-items:flex-start;gap:12px;}
  .card-prizes{display:flex;align-items:flex-end;gap:10px;flex:1;min-width:0;flex-wrap:wrap;}
  .card-prizes .prize-thumb{width:84px;height:84px;}
  .card-prizes .prize-others{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end;margin:0;}
  .card-prizes .prize-other{width:42px;height:42px;}
  .card-head-right{flex-direction:row;align-items:flex-start;gap:8px;}
  .card-head-right .mini-links{flex-direction:row;width:auto;gap:8px;}
  .mini-links button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:62px;height:56px;padding:6px 4px;border-radius:10px;font-size:.74rem;line-height:1;}
  .mini-links button::before{content:attr(data-icon);font-size:1.15rem;line-height:1;}
  .card-head-main .machine-top{margin-bottom:8px;}

  /* ---- Card header v4: handle | prize column | (title+toggle, numbers, info + links) ---- */
  .card-head{flex-direction:row;align-items:flex-start;gap:10px;margin-bottom:8px;}
  .card-head > .drag-handle{padding:2px 0 0;}
  .card-prizes{flex-direction:column;align-items:flex-end;flex:none;width:84px;gap:8px;flex-wrap:nowrap;}
  .card-prizes .prize-others{flex-direction:column;align-items:flex-end;gap:6px;}
  .card-head-main{display:flex;flex-direction:column;}
  .card-head-main .machine-top{margin-bottom:4px;align-items:flex-start;}
  .stat-row{align-items:flex-start;gap:14px;margin:0 0 4px;}
  .stat.stat-small{display:flex;flex-direction:column-reverse;margin-top:4px;}
  .stat.stat-small .stat-num{font-size:1.6rem;}
  .card-bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:6px;}
  .card-bottom .mini-links{flex-direction:row;gap:8px;width:auto;flex-shrink:0;}
  .card-info{min-width:0;}
  .info-lines{flex-direction:column;gap:3px;}
  .card-head-main .machine-name-static{font-size:.95rem;font-weight:700;color:var(--ink);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>The Chosen Ones</h1>
    <div class="sub">For tracking and treasures and stuff. For the people, kawan mahu lagi prizes.</div>
  </header>

  <div class="global-bar" id="globalBar"></div>

  <div class="player-list-bar">

    <span class="player-list-status" id="playerListStatus">No player list loaded yet.</span>

    <span>All cards:</span>
    <button class="tool-btn" data-tool="collapse-all" title="Collapse all cards (sections stay as they are)"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3 7l5-5 5 5M3 13l5-5 5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg> Collapse</button>
    <button class="tool-btn" data-tool="expand-all" title="Expand all cards (sections stay as they are)"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3 3l5 5 5-5M3 9l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg> Expand</button>
  </div>
  <div id="machines"><div class="loading">Connecting to relay…</div></div>
</div>

<script>
// ---------------------------------------------------------------------------
// Player-list CSV import — entirely local, unrelated to the relay. Unchanged
// from before.
// ---------------------------------------------------------------------------
const PLAYER_LIST_KEY = 'tc_player_list_v1';
const PLAYER_TAGS_KEY = 'tc_player_tags_v1';
let playerList = {};
let playerTags = {}; // id -> 'friend' | 'farmer' (only these two are styled; anything else is just ignored)
try { playerList = JSON.parse(localStorage.getItem(PLAYER_LIST_KEY) || '{}') || {}; } catch(e) { playerList = {}; }
try { playerTags = JSON.parse(localStorage.getItem(PLAYER_TAGS_KEY) || '{}') || {}; } catch(e) { playerTags = {}; }
function playerNameFor(id){
  const key=String(id || '').trim();
  return playerList[key] || key;
}
function playerTagFor(id){
  return playerTags[String(id || '').trim()] || null;
}
// Wraps a player's display name in a span carrying the tag's color class,
// if they have a recognized tag (friend/farmer) — used only where a player
// is shown as currently active (now playing / in queue), not in history.
function taggedPlayerHtml(id){
  const name = escapeAttr(playerNameFor(id));
  const tag = playerTagFor(id);
  return tag ? `<span class="player-tag-${tag}">${name}</span>` : name;
}
function parsePlayerCsv(text){
  const rows=[]; let row=[], cell='', quoted=false;
  for(let i=0;i<text.length;i++){
    const c=text[i], n=text[i+1];
    if(quoted && c==='"' && n==='"'){ cell+='"'; i++; }
    else if(c==='"'){ quoted=!quoted; }
    else if(c===',' && !quoted){ row.push(cell); cell=''; }
    else if((c==='\n'||c==='\r') && !quoted){
      if(c==='\r' && n==='\n') i++;
      row.push(cell); if(row.some(v=>v.trim())) rows.push(row); row=[]; cell='';
    } else cell+=c;
  }
  row.push(cell); if(row.some(v=>v.trim())) rows.push(row);
  return rows;
}
let playerListSource = null; // 'players.csv' (auto-fetched) or 'a manually uploaded file' — for the status line only
function updatePlayerListStatus(){
  const el=document.getElementById('playerListStatus');
  if(!el) return;
  const n = Object.keys(playerList).length;
  el.textContent = n
    ? `${n} players loaded${playerListSource ? ` (${playerListSource})` : ''}.`
    : 'No player list loaded yet.';
}
// Shared by both the auto-fetch and manual-upload paths: parses CSV text,
// validates it has usable playerID/playerName rows, and — only if valid —
// replaces the stored player list and persists it locally. Throws on
// anything invalid so callers can show their own error message. A third
// "tag" column is optional — only "friend" and "farmer" (case-insensitive)
// are recognized; anything else in that column is just left unstyled.
function applyPlayerCsvText(text, sourceLabel){
  const rows=parsePlayerCsv(text);
  if(!rows.length) throw new Error('The file is empty.');
  let start=0;
  const first=(rows[0][0] || '').replace(/^\ufeff/,'').trim().toLowerCase();
  if(first==='playerid' || first==='player id') start=1;
  const nextNames={};
  const nextTags={};
  for(let i=start;i<rows.length;i++){
    const id=(rows[i][0] || '').trim();
    const name=(rows[i][1] || '').trim();
    const tag=(rows[i][2] || '').trim().toLowerCase();
    if(id && name){
      nextNames[id]=name;
      if(tag === 'friend' || tag === 'farmer') nextTags[id]=tag;
    }
  }
  if(!Object.keys(nextNames).length) throw new Error('No valid playerID, playerName rows were found.');
  playerList=nextNames;
  playerTags=nextTags;
  playerListSource = sourceLabel;
  localStorage.setItem(PLAYER_LIST_KEY, JSON.stringify(playerList));
  localStorage.setItem(PLAYER_TAGS_KEY, JSON.stringify(playerTags));
  updatePlayerListStatus();
}

// ---------------------------------------------------------------------------
// State model
//
// The relay is now the single source of truth for which machines exist, plus
// their livePlays/lastStatus/history/lastAutoWin/prize info — that's
// `serverMachines`, rebuilt from the relay's broadcasts (step history is
// fetched separately, see `historyCache`). Only personal settings (display
// name override, alert threshold, section collapse state) stay local, keyed
// by "machineId:prizeId" in `localPrefs`. The THREE_CLAW payout numbers are
// shared and live on the relay.
// A machine being added but not yet sent to the relay lives in `drafts`
// until "Connect live" is clicked.
// ---------------------------------------------------------------------------
const PREFS_KEY = 'tc_local_prefs_v1';
const RELAY_URL = 'wss://tc-relay-it85.onrender.com';

let loaded = false;
let serverMachines = [];   // full state objects as broadcast by the relay
let localPrefs = {};       // machineKey -> personal settings (see defaultPrefs)
let drafts = [];           // machines being added, not yet tracked by the relay

try{ localPrefs = JSON.parse(localStorage.getItem(PREFS_KEY) || '{}') || {}; }catch(e){ localPrefs = {}; }

// Play-count alert settings belong to the MACHINE, not to one prize: every
// prize on a machine shares one play count, so switching the prize a card shows
// must not switch the alert off. They are kept per machineId in their own
// storage key, and each prize's prefs object reads/writes them through
// accessors (see bindAlertFields) so the rest of the code is unchanged.
const ALERTS_KEY = 'tc_machine_alerts_v1';
const ALERT_FIELDS = ['alertEnabled', 'alertAuto', 'alertPlayTarget', 'alertPlayFired'];
let machineAlerts = {};    // machineId -> {alertEnabled, alertAuto, alertPlayTarget, alertPlayFired}
try{ machineAlerts = JSON.parse(localStorage.getItem(ALERTS_KEY) || '{}') || {}; }catch(e){ machineAlerts = {}; }
function machineAlert(machineId){
  if(!machineAlerts[machineId]) machineAlerts[machineId] = {alertEnabled: false, alertAuto: true, alertPlayTarget: null, alertPlayFired: false};
  return machineAlerts[machineId];
}
function bindAlertFields(prefs, machineId){
  ALERT_FIELDS.forEach(f => Object.defineProperty(prefs, f, {
    configurable: true, enumerable: false,   // not saved per prize
    get(){ return machineAlert(machineId)[f]; },
    set(v){ machineAlert(machineId)[f] = v; },
  }));
}
// One-time: alert settings saved per prize by earlier versions move to their
// machine (an enabled one wins if a machine's prizes disagreed).
(function migrateAlertPrefs(){
  let moved = false;
  Object.keys(localPrefs).forEach(key => {
    const raw = localPrefs[key];
    if(!raw || typeof raw !== 'object' || !ALERT_FIELDS.some(f => Object.prototype.hasOwnProperty.call(raw, f))) return;
    const machineId = key.split(':')[0];
    if(raw.alertEnabled && !(machineAlerts[machineId] && machineAlerts[machineId].alertEnabled)){
      machineAlerts[machineId] = {alertEnabled: true, alertAuto: raw.alertAuto !== false,
        alertPlayTarget: raw.alertPlayTarget == null ? null : raw.alertPlayTarget, alertPlayFired: !!raw.alertPlayFired};
    }
    ALERT_FIELDS.forEach(f => delete raw[f]);
    moved = true;
  });
  if(moved){
    try{ localStorage.setItem(ALERTS_KEY, JSON.stringify(machineAlerts)); localStorage.setItem(PREFS_KEY, JSON.stringify(localPrefs)); }catch(e){ console.error('Storage error', e); }
  }
})();

// ---------------------------------------------------------------------------
// Categories — grouped by the prize title's prefix (e.g. "Figure - ..." ->
// "Figures"), which is shared relay data, so every browser derives the same
// grouping for free with no relay changes needed for the common case. An
// explicit override (the `category` field the relay broadcasts) takes
// precedence when someone sets one — that IS shared/relay-owned, so a
// manual override is visible to everyone watching, not just the browser
// that set it. Which categories are collapsed/expanded, though, is purely a
// personal display preference and stays local per browser.
const CATEGORY_PREFS_KEY = 'tc_category_prefs_v1';
let categoryPrefs = {};
try{ categoryPrefs = JSON.parse(localStorage.getItem(CATEGORY_PREFS_KEY) || '{}') || {}; }catch(e){ categoryPrefs = {}; }
function getCategoryPrefs(cat){
  if(!categoryPrefs[cat]) categoryPrefs[cat] = {collapsed: false};
  return categoryPrefs[cat];
}
function saveCategoryPrefs(){
  try{ localStorage.setItem(CATEGORY_PREFS_KEY, JSON.stringify(categoryPrefs)); }catch(e){ console.error('Storage error', e); }
}
function deriveCategory(prizeTitleEn){
  const prefix = (prizeTitleEn || '').split(' - ')[0].trim();
  if(!prefix) return 'Others';
  // Naive but good-enough pluralization for prize-title prefixes like
  // "Figure", "Light", "Plushie" — not meant to be linguistically perfect.
  if(/s$/i.test(prefix)) return prefix;
  if(/[^aeiou]y$/i.test(prefix)) return prefix.slice(0, -1) + 'ies';
  return prefix + 's';
}
function categoryFor(server){
  return server.category || deriveCategory(server.prizeTitleEn) || 'Others';
}
const CARD_ORDER_KEY = 'tc_card_order_v1';
let cardOrder = [];
try{ cardOrder = JSON.parse(localStorage.getItem(CARD_ORDER_KEY) || '[]') || []; }catch(e){ cardOrder = []; }
function saveCardOrder(){
  try{ localStorage.setItem(CARD_ORDER_KEY, JSON.stringify(cardOrder)); }catch(e){ console.error('Storage error', e); }
}
// One category per card, no matter which prize is currently selected: the first
// explicit category set on any of the machine's prizes, otherwise the one
// derived from the machine's first prize title.
function cardCategory(card){
  const explicit = card.prizes.find(p => p.category);
  if(explicit) return explicit.category;
  return deriveCategory(card.prizes[0].prizeTitleEn) || 'Others';
}
function groupMachinesByCategory(list){
  const groups = new Map();
  list.forEach(card => {
    const cat = cardCategory(card);   // one category per card, whichever prize is selected
    if(!groups.has(cat)) groups.set(cat, []);
    groups.get(cat).push(card);
  });
  // Within a section, cards follow the personal drag-and-drop order (new cards go last).
  const rank = id => { const i = cardOrder.indexOf(id); return i < 0 ? cardOrder.length : i; };
  groups.forEach(arr => arr.sort((a, b) => rank(a.machineId) - rank(b.machineId)));
  // Stable order (first-seen), but "Others" always sorts last.
  return Array.from(groups.entries())
    .map(([category, machines]) => ({category, machines}))
    .sort((a, b) => (a.category === 'Others') - (b.category === 'Others'));
}

function machineKey(machineId, prizeId){ return `${machineId}:${prizeId}`; }
function uid(){ return 'm_' + Math.random().toString(36).slice(2, 10); }

// ---------------------------------------------------------------------------
// Machine groups — the relay still tracks each machineId:prizeId pair as its
// own record (own count + history). The dashboard shows ONE card per
// machineId, with a prize switcher over that machine's tracked prizes. Which
// prize is selected, and whether the card is collapsed, are personal display
// prefs keyed by machineId.
// ---------------------------------------------------------------------------
const GROUP_PREFS_KEY = 'tc_group_prefs_v1';
let groupPrefs = {};
try{ groupPrefs = JSON.parse(localStorage.getItem(GROUP_PREFS_KEY) || '{}') || {}; }catch(e){ groupPrefs = {}; }
function saveGroupPrefs(){
  try{ localStorage.setItem(GROUP_PREFS_KEY, JSON.stringify(groupPrefs)); }catch(e){ console.error('Storage error', e); }
}
function getGroupPrefs(machineId){
  if(!groupPrefs[machineId]){
    // one-time carry-over of the old per-prize collapsed state
    const wasCollapsed = serverMachines.some(s => s.machineId === machineId && localPrefs[machineKey(s.machineId, s.prizeId)]?.collapsed);
    groupPrefs[machineId] = {selectedPrizeId: null, collapsed: wasCollapsed};
  }
  return groupPrefs[machineId];
}
function buildCards(){
  const byMachine = new Map();
  serverMachines.forEach(s => {
    if(!byMachine.has(s.machineId)) byMachine.set(s.machineId, []);
    byMachine.get(s.machineId).push(s);
  });
  return Array.from(byMachine.entries()).map(([machineId, prizes]) => {
    const gp = getGroupPrefs(machineId);
    const selected = prizes.find(p => p.prizeId === gp.selectedPrizeId) || prizes[0];
    return {machineId, prizes, selected};
  });
}

// Auto-arm: unless the person types their own number, the play-count alert
// fires ALERT_LEAD plays before the machine's payout (payout 27 -> alert at 24).
// The payout changes after every win, so the alert follows it with no re-arming.
// Typing a number and clicking Set / re-arm switches to that number; Clear
// switches back to auto.
const ALERT_LEAD = 3;
function autoAlertTarget(server){
  const p = Number(server && server.threeClawPayout);
  return (server && server.machineType === 'THREE_CLAW' && Number.isInteger(p) && p > ALERT_LEAD) ? p - ALERT_LEAD : null;
}
function alertTarget(prefs, server){
  if(prefs.alertAuto){
    const a = autoAlertTarget(server);
    if(a != null) return a;
  }
  const t = Number(prefs.alertPlayTarget);
  return Number.isInteger(t) && t > 0 ? t : null;
}

function defaultPrefs(){
  return {
    name: null,                    // null = fall back to the relay's prize title, then the key
    // (alert settings are per machine: alertEnabled, alertAuto — true = follow
    // payout - ALERT_LEAD, false = use alertPlayTarget — alertPlayTarget, alertPlayFired)

    collapsed: false,
    alertSectionCollapsed: false,
    payoutSectionCollapsed: false,
  };
}
function getPrefs(key){
  if(!localPrefs[key]) localPrefs[key] = defaultPrefs();
  bindAlertFields(localPrefs[key], key.split(':')[0]);   // re-bound on every call, so a re-pointed card follows its new machine
  return localPrefs[key];
}
function savePrefs(){
  try{ localStorage.setItem(PREFS_KEY, JSON.stringify(localPrefs)); localStorage.setItem(ALERTS_KEY, JSON.stringify(machineAlerts)); }catch(e){ console.error('Storage error', e); }
}

function fmtTime(iso){
  const d = new Date(iso);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

function beep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880;
    g.gain.setValueAtTime(0.001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
    o.start(); o.stop(ctx.currentTime + 0.5);
  }catch(e){}
}
function notify(title, body){
  if(window.Notification && Notification.permission === 'granted'){
    try{ new Notification(title, {body}); }catch(e){}
  }
}
function playCountAlert(name, livePlays){
  beep();
  notify('Play-count alert', `${name} reached play ${livePlays}.`);
}
// Personal alert threshold — checked locally against whatever livePlays the
// relay just broadcast. alertPlayFired lives in localPrefs so it doesn't
// re-fire every time this machine's update arrives.
function checkPlayCountAlert(prefs, livePlays, name, server){
  const target = alertTarget(prefs, server);
  if(prefs.alertEnabled && target != null &&
     !prefs.alertPlayFired && livePlays >= target){
    prefs.alertPlayFired = true;
    playCountAlert(name, livePlays);
    savePrefs();
  }
}

// ---------------------------------------------------------------------------
// Relay connection — ONE shared WebSocket for every tracked machine, not one
// per machine like before. The relay owns counting/win-detection/history;
// this client only reacts to what it broadcasts.
// ---------------------------------------------------------------------------
let socket = null;
let reconnectTimer = null;
let socketStatus = {ok:false, msg:'Connecting to relay…'};

function connectRelay(){
  if(socket) return;
  try{
    socket = new WebSocket(RELAY_URL);
  }catch(e){
    socketStatus = {ok:false, msg:'Could not open WebSocket: ' + e.message};
    render();
    scheduleReconnect();
    return;
  }

  socket.onopen = () => {
    socketStatus = {ok:true, msg:'Connected to relay'};
    sendToRelay({type:'listMachines'});
    render();
  };

  socket.onmessage = (ev) => {
    let msg;
    try{ msg = JSON.parse(ev.data); }catch(e){ return; }

    if(msg.type === 'machineList'){
      serverMachines = msg.data || [];
      render();
    } else if(msg.type === 'machineUpdate'){
      const key = machineKey(msg.data.machineId, msg.data.prizeId);
      const idx = serverMachines.findIndex(x => machineKey(x.machineId, x.prizeId) === key);
      const prev = idx >= 0 ? serverMachines[idx] : null;
      handleIncomingMachineUpdate(prev, msg.data, key);
      if(idx >= 0) serverMachines[idx] = msg.data; else serverMachines.push(msg.data);
      render();
    } else if(msg.type === 'history'){
      const hk = machineKey(msg.data.machineId, msg.data.prizeId);
      historyCache[hk] = {rev: msg.data.historyRev, rows: msg.data.history || []};
      render();
    } else if(msg.type === 'machineRemoved'){
      const key = machineKey(msg.data.machineId, msg.data.prizeId);
      delete historyCache[key]; delete historyAsked[key];
      serverMachines = serverMachines.filter(x => machineKey(x.machineId, x.prizeId) !== key);
      render();
    } else if(msg.type === 'trackingError'){
      alert('Could not start tracking: ' + ((msg.data && msg.data.message) || 'unknown error'));
    }
    // 'ping' and anything else from the relay is a no-op here.
  };

  socket.onerror = () => {
    socketStatus = {ok:false, msg:'WebSocket error — the relay may be waking up (Render free tier sleeps when idle) or unreachable.'};
    render();
  };

  socket.onclose = () => {
    socket = null;
    socketStatus = {ok:false, msg:'Disconnected from relay. Reconnecting in 5s…'};
    render();
    scheduleReconnect();
  };
}

function scheduleReconnect(){
  if(reconnectTimer) return;
  reconnectTimer = setTimeout(() => { reconnectTimer = null; connectRelay(); }, 5000);
}

// Step history is not sent with every update. Expanded cards ask the relay
// for it, and ask again whenever the relay's historyRev for that prize changes.
const historyCache = {};   // prize key -> {rev, rows}
const historyAsked = {};   // prize key -> {rev, at}
function ensureHistory(server, key){
  if(!server.historyTotal) return;
  const rev = server.historyRev || '';
  const have = historyCache[key];
  if(have && have.rev === rev) return;
  const asked = historyAsked[key];
  if(asked && asked.rev === rev && Date.now() - asked.at < 5000) return;
  historyAsked[key] = {rev, at: Date.now()};
  sendToRelay({type:'getHistory', data:{machineId: server.machineId, prizeId: server.prizeId}});
}

function sendToRelay(obj){
  if(socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify(obj));
}

// Local-only side effects of a machineUpdate: sound/notification alerts and
// the THREE_CLAW payout math both depend on this browser's personal
// settings, so they're computed here rather than trusted from the server.
const winNotified = {};   // machineId -> time of the win already announced
function handleIncomingMachineUpdate(prev, next, key){
  const prefs = getPrefs(key);
  const name = prefs.name || next.prizeTitleEn || next.prizeTitleJa || key;

  const prevWinTime = prev && prev.lastAutoWin ? prev.lastAutoWin.time : null;
  const nextWinTime = next.lastAutoWin ? next.lastAutoWin.time : null;
  if(nextWinTime && nextWinTime !== prevWinTime && winNotified[next.machineId] !== nextWinTime){
    winNotified[next.machineId] = nextWinTime;   // a machine's prizes all report the same win; tell the person once
    beep();
    notify(`${name}: win detected!`, `Won after ${next.lastAutoWin.count} play${next.lastAutoWin.count === 1 ? '' : 's'} — ${playerNameFor(next.lastAutoWin.player) || 'unknown player'}.`);
    // THREE_CLAW payout math is computed by the relay now (shared —
    // next.threeClawPayout/threeClawLastPayoutOwed arrive already updated
    // in this same broadcast), not here.
    prefs.alertPlayFired = false; // a new session is starting — re-arm the play-count alert for it
    savePrefs();
  }

  checkPlayCountAlert(prefs, next.livePlays, name, next);
}

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------
function notificationStatusLabel(){
  if(!window.Notification) return 'Desktop notifications: not supported by this browser';
  if(Notification.permission === 'granted') return 'Desktop notifications: enabled ✓';
  if(Notification.permission === 'denied') return 'Desktop notifications: blocked — check the padlock icon next to the address bar, or your OS notification settings for this browser';
  return 'Desktop notifications: not yet enabled — open the 🔔 Alert section on any card and click "Enable browser notifications"';
}

function updateGlobalBar(){
  const bar = document.getElementById('globalBar');
  if(!loaded){ bar.innerHTML = ''; return; }
  const staleCount = serverMachines.filter(x => x.prizeStale).length;
  bar.innerHTML = `
    <div><span class="status-dot ${socketStatus.ok ? 'live' : ''}"></span>${escapeAttr(socketStatus.msg)}</div>
    <div>${new Set(serverMachines.map(x => x.machineId)).size} machine${new Set(serverMachines.map(x => x.machineId)).size === 1 ? '' : 's'} (${serverMachines.length} prize${serverMachines.length === 1 ? '' : 's'}) tracked — shared with everyone watching this dashboard</div>
    <div style="${staleCount ? 'color:var(--alert);font-weight:600;' : ''}">${staleCount} irrelevant prize${staleCount === 1 ? '' : 's'} (no longer on their machine)</div>
    <div>${escapeAttr(notificationStatusLabel())}</div>
  `;
}

function escapeAttr(s){ return String(s ?? '').replace(/"/g, '&quot;'); }

function tokyoCatchUrl(m){
  return `https://tokyocatch.com/game/${m.machineId}-${m.prizeId}`;
}
function torebaPlusUrl(m){
  return `https://toreba.plus/annex/tkcatchhistory?mid=${encodeURIComponent(m.machineId + '-' + m.prizeId)}&pid=${encodeURIComponent(m.prizeId)}`;
}
function openPopup(url){
  const newTab = window.open(url, '_blank');
  if(newTab){ newTab.opener = null; }
}

const HEX24 = /^[0-9a-f]{24}$/i;

function catHue(cat){
  let h = 7;
  for(const ch of String(cat)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return h % 360;
}

function render(){
  updateGlobalBar();
  const root = document.getElementById('machines');
  root.innerHTML = '';
  if(!loaded){ root.innerHTML = '<div class="loading">Connecting to relay…</div>'; return; }

  if(drafts.length === 0 && serverMachines.length === 0){
    root.innerHTML = '<div class="empty-state">No machines yet. Add one below to start tracking.</div>';
    return;
  }

  // Drafts (not yet sent to the relay) render ungrouped, above every
  // category, since they don't have relay-confirmed prize data to derive a
  // category from yet.
  drafts.forEach(d => {
    const card = document.createElement('div');
    card.className = 'machine';
    card.innerHTML = renderDraftCard(d);
    root.appendChild(card);
  });

  groupMachinesByCategory(buildCards()).forEach(({category, machines}) => {
    const section = document.createElement('div');
    section.className = 'cat-section';
    section.dataset.category = category;
    section.style.setProperty('--h', catHue(category));
    section.innerHTML = renderCategorySection(category, machines);
    root.appendChild(section);
  });
}

function renderCategorySection(category, machines){
  const catPrefs = getCategoryPrefs(category);
  const escCat = escapeAttr(category);
  const count = machines.length;
  // extra counts are over every prize on the cards in this section, not just the one currently shown
  const allPrizes = machines.flatMap(c => c.prizes);
  const staleCount = allPrizes.filter(p => p.prizeStale).length;
  const lastChanceCount = allPrizes.filter(p => p.prizeLabel === 'LAST_CHANCE').length;
  const extraHtml =
    (lastChanceCount ? `<span class="cat-badge last-chance">${lastChanceCount} last chance</span>` : '') +
    (staleCount ? `<span class="cat-badge irrelevant">${staleCount} irrelevant</span>` : '');

  if(catPrefs.collapsed){
    return `
      <div class="category-header">
        <h2>${escCat}</h2>
        <button class="cat-toggle" data-action="toggle-category" data-category="${escCat}" title="Show this section's cards">▾ Show section</button>
      </div>
      <div class="category-summary"><span>currently tracking ${count} item${count === 1 ? '' : 's'}</span>${extraHtml}</div>
    `;
  }

  let html = `
    <div class="category-header">
      <h2>${escCat}</h2>
      <button class="cat-toggle" data-action="toggle-category" data-category="${escCat}" title="Hide this whole section">▴ Hide section</button>
    </div>
  `;
  html += '<div class="card-grid">';
  machines.forEach(card => {
    const server = card.selected;
    const key = machineKey(server.machineId, server.prizeId);
    const prefs = getPrefs(key);
    const isCollapsed = getGroupPrefs(server.machineId).collapsed;
    const armed = !!prefs.alertEnabled && alertTarget(prefs, server) != null && !prefs.alertPlayFired;
    html += `<div class="machine${server.prizeStale ? ' alerting' : ''}${armed ? ' armed' : ''}${isCollapsed ? '' : ' expanded'}"${armed ? ' title="Alert armed"' : ''} data-machine="${escapeAttr(server.machineId)}">${renderTrackedCard(server, prefs, key, card.prizes)}</div>`;
  });
  html += '</div>';
  return html;
}

function renderDraftCard(d){
  const idsValid = HEX24.test(d.machineId || '') && HEX24.test(d.prizeId || '');
  const sameMachine = idsValid && serverMachines.some(s => s.machineId === d.machineId);
  const sibling = sameMachine ? buildCards().find(c => c.machineId === d.machineId) : null;
  const catPlaceholder = sibling
    ? `${cardCategory(sibling)} (same as this machine's existing card)`
    : 'Auto-detected from the prize title';
  return `
    <div class="machine-top">
      <input class="machine-name" value="${escapeAttr(d.name || '')}" placeholder="New machine" data-draft="${d.id}" data-field="name" />
      <div class="top-actions">
        <button class="icon-btn" data-draft="${d.id}" data-action="remove-draft">Remove</button>
      </div>
    </div>
    <div class="category-row">
      <label>Category</label>
      <input type="text" value="${escapeAttr(d.category || '')}" placeholder="${escapeAttr(catPlaceholder)}" data-draft="${d.id}" data-field="category" />
    </div>
    <div class="link-hint" style="margin-top:-8px;margin-bottom:14px;">Shared — moves this card for everyone watching. Leave blank to auto-detect from the prize title.</div>
    <div class="live-config">
      <label>TokyoCatch prize link</label>
      <input type="text" placeholder="Paste a TokyoCatch game link here, e.g. https://tokyocatch.com/game/686abfea206128473c01e7dd-6a8409305d57c7003f6844ea" value="${escapeAttr(d.gameLink || '')}" data-draft="${d.id}" data-field="gameLink" />
      <div class="row">
        <div><label>Machine ID</label><input type="text" placeholder="Machine ID" value="${escapeAttr(d.machineId || '')}" data-draft="${d.id}" data-field="machineId" /></div>
        <div><label>Prize ID</label><input type="text" placeholder="Prize ID" value="${escapeAttr(d.prizeId || '')}" data-draft="${d.id}" data-field="prizeId" /></div>
      </div>
      <div class="link-hint ${idsValid ? 'ok' : 'err'}">
        ${idsValid
          ? (sameMachine ? 'This machine is already on the dashboard — this prize will be added to its existing card (switch with Change Prize). Click Connect live to start tracking it.' : 'IDs detected — click Connect live to start tracking. This will be visible to everyone watching this dashboard.')
          : 'No link entered yet — paste a TokyoCatch game link above to fill these in automatically.'}
      </div>
      <div style="margin-top:8px;">
        <button class="primary" style="width:100%;" data-draft="${d.id}" data-action="connect-live">Connect live</button>
      </div>
    </div>
  `;
}

const ICON_UP = '<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M3 10l5-5 5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ICON_DOWN = '<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M3 6l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function renderTrackedCard(server, prefs, key, prizes){
  const displayName = prefs.name || server.prizeTitleEn || server.prizeTitleJa || key;
  const lastFields = server.lastFields || {};
  const collapsed = getGroupPrefs(server.machineId).collapsed;
  if(!collapsed) ensureHistory(server, key);
  const history = (historyCache[key] && historyCache[key].rows) || server.history || [];
  const prizeName = p => getPrefs(machineKey(p.machineId, p.prizeId)).name || p.prizeTitleEn || p.prizeTitleJa || `Prize ${p.prizeId.slice(0, 6)}…`;
  // Small clickable picture of one of this machine's other prizes, shown under
  // the stats on a collapsed card. Clicking it makes that prize the one shown.
  const otherPrizeThumb = p => {
    let src = p.prizeImageUrl || '';
    if(src.startsWith('//')) src = 'https:' + src;
    else if(src.startsWith('/')) src = 'https://tokyocatch.com' + src;
    const tip = `${prizeName(p)} — ${p.livePlays} play${p.livePlays === 1 ? '' : 's'}${p.prizeStale ? ' (no longer on this machine)' : ''}`;
    return `<button class="prize-other${p.prizeStale ? ' stale' : ''}" data-action="select-prize" data-machine="${escapeAttr(p.machineId)}" data-prize="${escapeAttr(p.prizeId)}" title="${escapeAttr(tip)}" aria-label="${escapeAttr('Show ' + prizeName(p))}">${src ? `<img src="${escapeAttr(src)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'" />` : ''}</button>`;
  };
  let thumbSrc = server.prizeImageUrl || '';
  if(thumbSrc.startsWith('//')) thumbSrc = 'https:' + thumbSrc;
  else if(thumbSrc.startsWith('/')) thumbSrc = 'https://tokyocatch.com' + thumbSrc;
  const thumb = thumbSrc ? `<img class="prize-thumb" src="${escapeAttr(thumbSrc)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'" />` : '';
  // Ticket cost is N/A when the machine can't be played with a ticket;
  // otherwise it is the prize's ticketCost. Unknown until TokyoCatch's next
  // MACHINE_INIT for this prize arrives (shown as a dash).
  const autoAt = prefs.alertAuto ? autoAlertTarget(server) : null;   // non-null = following the payout
  const alertAt = alertTarget(prefs, server);
  // How close the play count is to the target: 0 normal, 1 within 3 plays of the
  // alert target, 2 at/over the alert target, 3 at/over the payout (or the target
  // itself when the machine has no payout number).
  const plays = Number(server.livePlays) || 0;
  const hasPayout = server.machineType === 'THREE_CLAW' && server.threeClawPayout != null && Number.isFinite(Number(server.threeClawPayout));
  const dueAt = hasPayout ? Number(server.threeClawPayout) : alertAt;
  // Target = the payout when the machine has one, otherwise the alert number.
  const target = dueAt;
  let heat = 0;
  if(target != null){
    const left = target - plays;
    heat = left <= 0 ? 3 : left <= 3 ? 2 : left <= 6 ? 1 : 0;
  }
  const toGo = target != null ? (plays >= target ? 'reached' : `${target - plays} to go`) : '';
  const ticketText = server.isDisabledPlayByTicket ? 'N/A' : (server.ticketCost != null ? server.ticketCost : '—');
  const gemText = server.gemCost != null ? server.gemCost : '—';
  const metaParts = [];
  metaParts.push(`Ticket cost: <b>${escapeAttr(ticketText)}</b>`);
  metaParts.push(`Gem cost: <b>${escapeAttr(gemText)}</b>`);
  if(server.machineType) metaParts.push(`Machine type: <b>${escapeAttr(server.machineType)}</b>`);
  if(server.prizeLabel) metaParts.push(`Label: <b class="prize-label${server.prizeLabel === 'LAST_CHANCE' ? ' last-chance' : ''}">${escapeAttr(server.prizeLabel)}</b>`);
  const switcher = prizes.length > 1 ? `
      <select data-machine="${server.machineId}" data-field="switchPrize" title="Change Prize">
        ${prizes.map(p => `<option value="${p.prizeId}" ${p.prizeId === server.prizeId ? 'selected' : ''}>${p.prizeStale ? '⚠️ ' : ''}${escapeAttr(prizeName(p))} — ${p.livePlays} play${p.livePlays === 1 ? '' : 's'}</option>`).join('')}
      </select>` : '';

  const esc = escapeAttr;
  const prettify = v => String(v).toLowerCase().split('_').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
  const q = lastFields.queuedUsers || [];
  const alertState = !prefs.alertEnabled ? 'off' : (!alertAt ? 'on, no target' : (prefs.alertPlayFired ? `fired at ${alertAt}` : `armed at ${alertAt}`));
  const sect = (flag, title, status, body) => `
    <details class="sect" data-sect="${flag}" data-key="${key}" ${prefs[flag] ? 'open' : ''}>
      <summary><span>${title}</span><span class="sect-status">${status}</span></summary>
      <div class="sect-body">${body}</div>
    </details>`;

  const stats = `
    <div class="stat-row">
      <div class="stat heat-${heat}"><div class="stat-num">${plays}${target != null ? `<span class="stat-slash">/</span>${target}` : ''}</div><div class="stat-cap">Plays${target != null ? ' / Target' : ''}${toGo ? ' · ' + toGo : ''}</div></div>
      ${prefs.alertEnabled && alertAt != null && alertAt !== target ? `<div class="stat stat-small"><div class="stat-num">${alertAt}</div><div class="stat-cap">Alert at</div></div>` : ''}
    </div>`;
  const links = server.machineId && server.prizeId ? `<div class="mini-links">
      <button data-key="${key}" data-action="open-tokyocatch" data-icon="🐙" title="Open this prize on TokyoCatch (new tab)">TCatch</button>
      <button data-key="${key}" data-action="open-toreba" data-icon="📊" title="Open the Toreba.Plus Annex history (new tab)">Annex</button>
    </div>` : '';
  const nameEl = collapsed
    ? `<div class="machine-name-static" title="${esc(displayName)}">${esc(displayName)}</div>`
    : `<input class="machine-name" value="${esc(prefs.name || '')}" placeholder="${esc(server.prizeTitleEn || server.prizeTitleJa || 'New machine')}" data-key="${key}" data-field="name" />`;
  const othersHtml = prizes.length > 1 ? `<div class="prize-others">${prizes.filter(p => p.prizeId !== server.prizeId).map(otherPrizeThumb).join('')}</div>` : '';
  const toggleBtn = `<button class="card-toggle" data-key="${key}" data-action="toggle-collapse" title="${collapsed ? 'Expand this card' : 'Collapse this card'}" aria-label="${collapsed ? 'Expand this card' : 'Collapse this card'}">${collapsed ? ICON_DOWN : ICON_UP}</button>`;
  const head = (info) => `
    <div class="card-head">
      <span class="drag-handle" draggable="true" title="Drag to reorder, or drop into another section" aria-label="Drag handle">⋮⋮</span>
      <div class="card-prizes">${thumb}${othersHtml}</div>
      <div class="card-head-main">
        <div class="machine-top">
          ${nameEl}
          ${toggleBtn}
        </div>
        ${stats}
        <div class="card-bottom">
          <div class="card-info">${info}</div>
          ${links}
        </div>
      </div>
    </div>`;

  if(collapsed){
    return head(`<div class="machine-summary info-lines">
          ${server.prizeStale ? `<span class="summary-tag stale">Irrelevant Prize</span>` : ''}
          ${server.prizeLabel ? `<span>Label <b>${esc(prettify(server.prizeLabel))}</b></span>` : ''}
          <span>Ticket cost <b>${esc(ticketText)}</b></span>
          <span>Gem cost <b>${esc(gemText)}</b></span>
        </div>`);
  }

  const chips = [
    `<span class="chip">Ticket <b>${esc(ticketText)}</b></span>`,
    `<span class="chip">Gem <b>${esc(gemText)}</b></span>`,
    server.machineType ? `<span class="chip">${esc(prettify(server.machineType))}</span>` : '',
    server.prizeLabel ? `<span class="chip${server.prizeLabel === 'LAST_CHANCE' ? ' last-chance' : ''}">${esc(prettify(server.prizeLabel))}</span>` : '',
    server.prizeStale ? `<span class="chip warn">Irrelevant prize</span>` : ''
  ].join('');
  const titles = (prefs.name && server.prizeTitleEn ? `<div>${esc(server.prizeTitleEn)}</div>` : '') + (server.prizeTitleJa ? `<div>${esc(server.prizeTitleJa)}</div>` : '');

  const alertBody = `
      <div class="play-alert-row">
        <label class="play-alert-toggle"><input type="checkbox" ${prefs.alertEnabled ? 'checked' : ''} data-key="${key}" data-field="alertEnabled" /> On</label>
        <input type="number" min="1" step="1" placeholder="Alert at play" value="${alertAt || ''}" data-key="${key}" data-field="alertPlayTarget" />
        <button class="ghost" data-key="${key}" data-action="set-alert" title="Set / re-arm">Set</button>
        <button class="ghost" data-key="${key}" data-action="clear-alert" title="Clear (back to auto)">Clear</button>
      </div>
      <div class="play-alert-status ${prefs.alertEnabled && alertAt && !prefs.alertPlayFired ? 'armed' : ''}">
        ${!prefs.alertEnabled ? 'Off. Tick “On” for a sound alert.' :
          (!alertAt ? 'No payout to follow yet. Enter a play number and press Set.' :
          (prefs.alertPlayFired ? `Fired at play ${alertAt}. ${autoAt != null ? 'Re-arms after the next win.' : 'Set a new target, or Clear for auto.'}` :
          `Armed at play ${alertAt}${autoAt != null ? ` (payout ${server.threeClawPayout} − ${ALERT_LEAD})` : ' (your number)'} · now ${server.livePlays}.`))}
        <span class="muted">Only you get the sound.</span>
      </div>
      ${window.Notification && Notification.permission === 'granted' ? '' : `<button class="ghost" data-key="${key}" data-action="notifperm">Enable browser notifications</button>`}`;

  const payoutBody = `
      <div class="play-alert-row">
        <label class="mini-field">Usual rate
          <input type="number" min="1" step="1" placeholder="28" value="${server.threeClawUsualRate != null ? server.threeClawUsualRate : ''}" data-key="${key}" data-field="threeClawUsualRate" />
        </label>
        <label class="mini-field">Last owed
          <input type="number" step="1" value="${server.threeClawLastPayoutOwed != null ? server.threeClawLastPayoutOwed : ''}" data-key="${key}" data-field="threeClawLastPayoutOwed" />
        </label>
        <label class="mini-field">Payout
          <div class="payout-val">${server.threeClawPayout != null ? server.threeClawPayout : '—'}</div>
        </label>
        <button class="ghost" data-key="${key}" data-action="compute-payout">Compute</button>
        <button class="ghost" data-key="${key}" data-action="reset-payout">Reset to usual</button>
      </div>`;

  const manageBody = `
      <div class="category-row">
        <label>Category</label>
        <input type="text" value="${esc(server.category || '')}" placeholder="${esc(deriveCategory(server.prizeTitleEn))} (auto)" data-key="${key}" data-field="category" />
      </div>
      <div class="link-hint">Shared with everyone. Blank = auto from the prize title. You can also drag the card.</div>
      <div class="live-config">
        <label>TokyoCatch prize link</label>
        <input type="text" placeholder="Paste a corrected prize link if this machine has moved on" value="${esc(`https://tokyocatch.com/game/${server.machineId}-${server.prizeId}`)}" data-key="${key}" data-field="gameLink" />
        <div class="row">
          <div><label>Machine ID</label><input type="text" placeholder="Machine ID" value="${esc(server.machineId)}" data-key="${key}" data-field="machineId" /></div>
          <div><label>Prize ID</label><input type="text" placeholder="Prize ID" value="${esc(server.prizeId)}" data-key="${key}" data-field="prizeId" /></div>
        </div>
        <div class="link-hint ok">Editing these re-points this card at a different machine/prize.</div>
        ${server.liveStatus ? `<div class="live-status ${server.liveStatus.ok ? 'ok' : 'err'}">${esc(server.liveStatus.msg)}</div>` : '<div class="live-status">Not connected yet.</div>'}
        ${server.lastFields ? `<div class="live-fields"><span>status: <b>${esc(lastFields.status || '—')}</b></span><span>viewers: <b>${lastFields.viewerCount ?? '—'}</b></span><span>maintenance: <b>${lastFields.isMaintenance ? 'yes' : 'no'}</b></span></div>` : ''}
      </div>
      <button class="ghost danger" data-key="${key}" data-action="remove">Remove prize</button>`;

  const historyBody = history.length === 0
    ? (server.historyTotal > 0 ? '<div class="hist-empty">Loading history…</div>' : '<div class="hist-empty">No entries yet — plays will appear here as they happen.</div>')
    : `<div class="history"><table class="step-table">
        <thead><tr><th class="step-num">Step</th><th>Played by</th><th>Play time</th></tr></thead>
        <tbody>
        ${history.slice().reverse().slice(0,80).map(h => `
          <tr class="${h.isWin ? 'win' : ''}">
            <td class="step-num">${h.step}: ${h.isWin ? '<span class="trophy">🏆</span>' : '<span class="lose-x">✕</span>'}</td>
            <td>${h.player ? `<span class="player-link">${taggedPlayerHtml(h.player)}</span>` : '<span style="color:var(--muted);font-style:italic;">unknown</span>'}</td>
            <td><span class="time-link">${fmtTime(h.t)}</span></td>
          </tr>`).join('')}
        </tbody>
      </table></div>`;

  return head(titles ? `<div class="x-titles">${titles}</div>` : '') + `
    <div class="x-body">
      <div class="chips">${chips}</div>
      ${server.prizeStale ? `<div class="warn-box"><b>⚠️ Prize no longer on this machine.</b> ${prizes.length > 1 ? 'Counting carries on via this machine’s other prize(s).' : server.dataSinceStale ? 'Plays are still counted but may belong to the new prize.' : 'No new plays are being counted here; your count and history are kept.'} To track the current prize, use “+ Add a machine to track”.</div>` : ''}
      ${server.liveStatus && !server.liveStatus.ok ? `<div class="live-status err">${esc(server.liveStatus.msg)}</div>` : ''}
      ${switcher ? `<div class="prize-actions">${switcher}</div>` : ''}
      <div class="live-line">
        ${lastFields.currentPlayingUser ? `<div>🎮 Now playing: ${taggedPlayerHtml(lastFields.currentPlayingUser.id)}</div>` : `<div class="muted">🎮 No one playing right now</div>`}
        ${q.length ? `<div>⏳ Queue (${q.length}): ${q.map(u => taggedPlayerHtml(u.id)).join(', ')}</div>` : ''}
        ${server.lastAutoWin ? `<div>🏆 Last win at ${server.lastAutoWin.count} plays — ${server.lastAutoWin.player ? taggedPlayerHtml(server.lastAutoWin.player) : 'unknown player'}, ${fmtTime(server.lastAutoWin.time)}</div>` : ''}
      </div>
      ${sect('openAlert', '🔔 Alert', alertState, alertBody)}
      ${server.machineType === 'THREE_CLAW' ? sect('openPayout', '🎯 Payout', server.threeClawPayout != null ? `payout ${server.threeClawPayout}` : 'not set', payoutBody) : ''}
      ${sect('openManage', '⚙️ Manage', 'category, link, remove', manageBody)}
      ${sect('openHistory', '📜 Step history', `${server.historyTotal ?? history.length} plays`, historyBody)}
    </div>
  `;
}
